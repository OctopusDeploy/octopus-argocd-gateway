version: v2
clean: false
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/octopusdeploy/octopus-argocd-gateway/internal/protos
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.6
    out: internal/protos
    opt: paths=source_relative
  - remote: buf.build/grpc/go:v1.5.1
    out: internal/protos
    opt: paths=source_relative

inputs:
  - directory: internal/protos/definitions