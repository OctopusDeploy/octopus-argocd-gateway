name: Renovate update dependencies
concurrency: renovate
on:
  schedule:
    # UTC 23:00 Sunday–Thursday = 09:00 Australia/Brisbane (UTC+10, no DST), Monday–Friday.
    - cron: '0 23 * * 0-4'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Dry run'
        required: false
        default: true
        type: boolean
      log-level:
        description: 'Renovate log level'
        required: false
        default: 'info'
        type: choice
        options:
          - trace
          - debug
          - info
          - warn
          - error

# Renovate authenticates with RENOVATE_GITHUB_TOKEN; the default GITHUB_TOKEN is only used for checkout
permissions:
  contents: read

jobs:
  renovate:
    name: Self-hosted Renovate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Self-hosted Renovate
        uses: renovatebot/github-action@2804199d260ad00c1fae0e9e842888369391c776 # v46.3.10
        with:
          configurationFile: renovate-config.js
          token: ${{ secrets.RENOVATE_GITHUB_TOKEN }}
        env:
          # On scheduled runs there are no inputs, so fall back to Renovate's
          # own default log level (info).
          LOG_LEVEL: ${{ inputs.log-level || 'info' }}
          RENOVATE_DRY_RUN: ${{ inputs.dry-run && 'full' || null }}
