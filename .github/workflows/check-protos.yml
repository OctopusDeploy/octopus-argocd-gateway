name: "Check Protos"
run-name: "Check Protos"
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      statuses: write
      checks: write
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
      - name: Check for significant changes
        id: changed-files-specific
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            **.proto
      - name: Buf
        if: steps.changed-files-specific.outputs.any_changed == 'true'
        uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
        with:
          push: false
          lint: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'buf skip lint') }}
          format: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'buf skip format') }}
          breaking: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'buf skip breaking') }}
          breaking_against: https://github.com/OctopusDeploy/octopus-argocd-gateway.git#subdir=internal/protos/definitions,filter=tree:0