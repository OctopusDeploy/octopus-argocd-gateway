syntax = "proto3";
package octopus.argo_cd_gateway.contracts.v1;

import "watch_application_resources_request.proto";
import "watch_application_resources_response.proto";

option csharp_namespace = "Octopus.ArgoCD.Gateway.MessageContracts";
option go_package = "github.com/octopusdeploy/octopus-argocd-gateway/internal/protos";

service ApplicationResourceService {
  rpc WatchApplicationResources(stream WatchApplicationResourcesResponse) returns (stream WatchApplicationResourcesRequest);
}
