syntax = "proto3";
package octopus.argo_cd_gateway.contracts.v1;

import "application_uid.proto";

option csharp_namespace = "Octopus.ArgoCD.Gateway.MessageContracts";
option go_package = "github.com/octopusdeploy/octopus-argocd-gateway/internal/protos";

message WatchApplicationResourcesResponse {
  ApplicationResourceResult results = 1;
}

message ApplicationResourceResult {
  repeated PresentApplicationResource present_resources = 1;
  repeated MissingApplicationResource missing_resources = 2;
  repeated ChildApplicationResource child_resources = 3;
  ApplicationUid application_uid = 4;
  WatchApplicationResourcesError error = 5;
}

message WatchApplicationResourcesError {
  string error_message = 1;
}

message PresentApplicationResource {
  string resource_uid = 1;
  string name = 2;
  string kubernetes_namespace = 3;
  string group = 4;
  string version = 5;
  string kind = 6;
  string resource_status_code = 7;
  string resource_status_message = 8;
  string resource_sync_status_code = 9;
}

message MissingApplicationResource {
  string name = 1;
  string kubernetes_namespace = 2;
  string group = 3;
  string version = 4;
  string kind = 5;
}

message ChildApplicationResource {
  string resource_uid = 1;
  string parent_resource_uid = 2;
  string root_resource_uid = 3;
  string name = 4;
  string kubernetes_namespace = 5;
  string group = 6;
  string version = 7;
  string kind = 8;
  string resource_status_code = 9;
  string resource_status_message = 10;
}
