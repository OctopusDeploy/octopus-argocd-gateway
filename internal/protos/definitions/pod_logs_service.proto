syntax = "proto3";
package octopus.argo_cd_gateway.contracts.v1;

import "pod_log_entry.proto";
import "request_error.proto";

option csharp_namespace = "Octopus.ArgoCD.Gateway.MessageContracts";
option go_package = "github.com/octopusdeploy/octopus-argocd-gateway/internal/protos";

service PodLogsService {
  rpc GetPodLogs(stream GetPodLogsResponse) returns (stream GetPodLogsRequest);
}

message GetPodLogsRequest {
  string request_id = 1;
  string application_name = 2;
  string application_project = 3;
  string application_namespace = 4;
  string resource_namespace = 5;
  string pod_name = 6;
  string container_name = 7;
  bool previous_container = 8;
}

message GetPodLogsResponse {
  string request_id = 1;
  repeated PodLogEntry entries = 2;
  optional RequestError request_error = 3;
}
