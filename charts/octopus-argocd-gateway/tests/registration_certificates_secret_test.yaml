suite: test registration certificates secret
templates:
  - registration-certificates-secret.yaml
tests:
  - it: creates secret when registration.register is true
    set:
      registration.register: true
      registration.octopus.serverCertificate: "foobar"
    asserts:
      - isKind:
          of: Secret
      - hasDocuments:
          count: 1

  - it: does not create secret when registration.register is false
    set:
      registration.register: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should add octopus grpc cert if value exists
    set:
      gateway.octopus.serverCertificate: "foobar"
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: octopus-argocd-gateway-registration-certificates
      - equal:
          path: data["octopus-server-grpc-certificate.pem"]
          value: foobar
      - notExists:
          path: data["octopus-server-http-certificate.pem"]
      - notExists:
          path: data["argo-cd-server-certificate.pem"]

  - it: should add octopus http cert if value exists
    set:
      registration.octopus.serverCertificate: "foobar"
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: octopus-argocd-gateway-registration-certificates
      - equal:
          path: data["octopus-server-http-certificate.pem"]
          value: foobar
      - notExists:
          path: data["octopus-server-grpc-certificate.pem"]
      - notExists:
          path: data["argo-cd-server-certificate.pem"]

  - it: should add argo cd cert if value exists
    set:
      gateway.argocd.serverCertificate: "foobar"
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: octopus-argocd-gateway-registration-certificates
      - equal:
          path: data["argo-cd-server-certificate.pem"]
          value: foobar
      - notExists:
          path: data["octopus-server-grpc-certificate.pem"]
      - notExists:
          path: data["octopus-server-http-certificate.pem"]
  - it: should add certificates from certificate array property
    set:
      gateway.serverCertificates: ["cert1", "cert2", "cert3"]
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: octopus-argocd-gateway-registration-certificates
      - equal:
          path: data["certificate-0.pem"]
          value: cert1
      - equal:
          path: data["certificate-1.pem"]
          value: cert2
      - equal:
          path: data["certificate-2.pem"]
          value: cert3
  - it: should add certificates from certificate array property and old certificate property
    set:
      gateway.serverCertificates: ["cert1", "cert2", "cert3"]
      gateway.argocd.serverCertificate: "foobar"
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: octopus-argocd-gateway-registration-certificates
      - equal:
          path: data["certificate-0.pem"]
          value: cert1
      - equal:
          path: data["certificate-1.pem"]
          value: cert2
      - equal:
          path: data["certificate-2.pem"]
          value: cert3
      - equal:
          path: data["argo-cd-server-certificate.pem"]
          value: foobar
  - it: should not generate secret if serverCertificateSecretName is set
    set:
      gateway.serverCertificateSecretName: "test"
      gateway.serverCertificates: [ "cert1", "cert2", "cert3" ]
    asserts:
      - hasDocuments:
          count: 0