suite: test gateway argocd authentication secret
templates:
  - gateway-argocd-authentication-secret.yaml
set:
  gateway.argocd.authenticationToken: foobar
tests:
  - it: set argocd authentication token
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: stringData.token
          value: foobar

  - it: sets the secret name correctly, if supplied in the values
    set:
      gateway.argocd.authenticationTokenSecretName: "my-secret"
    asserts:
      - equal:
          path: metadata.name
          value: "my-secret"

  - it: should set the key name correctly, if supplied in the values
    set:
      gateway.argocd.authenticationTokenSecretKey: "my-key"
    asserts:
      - equal:
          path: stringData["my-key"]
          value: foobar

  - it: should not render if authenticationToken is empty
    set:
      gateway.argocd.authenticationToken: ""
    asserts:
      - hasDocuments:
          count: 0
