suite: test registration secret
templates:
  - registration-secret.yaml
set:
  registration.register: true
tests:
  - it: creates secret when registration.register is true
    set:
      registration.octopus.serverAccessToken: "access-token"
    asserts:
      - isKind:
          of: Secret
      - hasDocuments:
          count: 1

  - it: does not create secret when registration.register is false
    set:
      registration.register: false
    asserts:
      - hasDocuments:
          count: 0

  - it: sets the secret name correctly, if supplied in the values
    set:
      registration.octopus.serverAccessToken: "access-token"
      registration.octopus.serverAccessTokenSecretName: "my-secret"
    asserts:
      - equal:
          path: metadata.name
          value: "my-secret"

  - it: should set the key name correctly, if supplied in the values
    set:
      registration.octopus.serverAccessToken: "access-token"
      registration.octopus.serverAccessTokenSecretKey: "my-key"
    asserts:
      - equal:
          path: stringData["my-key"]
          value: access-token

  - it: does not create secret when external serverAccessToken is empty
    asserts:
      - hasDocuments:
          count: 0
