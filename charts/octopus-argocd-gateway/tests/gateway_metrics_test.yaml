suite: test gateway metrics
templates:
  - gateway-deployment.yaml
set:
  gateway.argocd.authenticationToken: "my-token"
tests:
  - it: should include OCTOPUS_METRICS_PORT env var with default port when metrics enabled
    set:
      metrics.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OCTOPUS_METRICS_PORT
            value: "9090"

  - it: should include OCTOPUS_METRICS_PORT env var with custom port when metrics enabled and port overridden
    set:
      metrics.enabled: true
      metrics.port: 8888
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OCTOPUS_METRICS_PORT
            value: "8888"

  - it: should set OCTOPUS_METRICS_PORT to 0 when metrics disabled
    set:
      metrics.enabled: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OCTOPUS_METRICS_PORT
            value: "0"

  - it: should fail when metrics enabled and port is 0
    set:
      metrics.enabled: true
      metrics.port: 0
    asserts:
      - failedTemplate:
          errorMessage: "metrics.port must not be 0 when metrics.enabled is true"
