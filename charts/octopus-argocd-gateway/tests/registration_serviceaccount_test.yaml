suite: test registration service account
templates:
  - registration-serviceaccount.yaml
tests:
  - it: creates service account when registration.register and registration.serviceAccount.create are true
    set:
      registration.register: true
      registration.serviceAccount.create: true
    asserts:
      - isKind:
          of: ServiceAccount
      - hasDocuments:
          count: 1

  - it: does not create service account when either registration.register or registration.serviceAccount.create are false
    set:
      registration.register: false
      registration.serviceAccount.create: false
    asserts:
      - hasDocuments:
          count: 0