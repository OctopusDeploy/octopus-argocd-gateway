suite: test gateway argocd project auth tokens secret
templates:
  - gateway-argocd-project-auth-tokens-secret.yaml
tests:
  - it: renders one stringData key per project, prefixed with PROJECT_AUTH_TOKEN_
    set:
      gateway.argocd.projectAuthentication:
        - project: alpha
          token: t1
        - project: beta
          token: t2
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: stringData.PROJECT_AUTH_TOKEN_alpha
          value: t1
      - equal:
          path: stringData.PROJECT_AUTH_TOKEN_beta
          value: t2

  - it: omits the secret when projectAuthentication is empty and no external name is set
    asserts:
      - hasDocuments:
          count: 0

  - it: omits the secret when projectAuthenticationSecretName references an external secret
    set:
      gateway.argocd.projectAuthenticationSecretName: my-external-secret
    asserts:
      - hasDocuments:
          count: 0

  - it: fails when both projectAuthentication and projectAuthenticationSecretName are set
    set:
      gateway.argocd.projectAuthentication:
        - project: alpha
          token: t1
      gateway.argocd.projectAuthenticationSecretName: my-external-secret
    asserts:
      - failedTemplate:
          errorMessage: gateway.argocd.projectAuthentication and gateway.argocd.projectAuthenticationSecretName cannot both be set

  - it: fails when authenticationToken and projectAuthentication are both set
    set:
      gateway.argocd.authenticationToken: global-token
      gateway.argocd.projectAuthentication:
        - project: alpha
          token: t1
    asserts:
      - failedTemplate:
          errorMessage: "gateway.argocd.authenticationToken/authenticationTokenSecretName and gateway.argocd.projectAuthentication/projectAuthenticationSecretName are mutually exclusive — configure only one"

  - it: fails when authenticationToken and projectAuthenticationSecretName are both set
    set:
      gateway.argocd.authenticationToken: global-token
      gateway.argocd.projectAuthenticationSecretName: my-external-secret
    asserts:
      - failedTemplate:
          errorMessage: "gateway.argocd.authenticationToken/authenticationTokenSecretName and gateway.argocd.projectAuthentication/projectAuthenticationSecretName are mutually exclusive — configure only one"

  - it: fails when authenticationTokenSecretName and projectAuthentication are both set
    set:
      gateway.argocd.authenticationTokenSecretName: external-global-secret
      gateway.argocd.projectAuthentication:
        - project: alpha
          token: t1
    asserts:
      - failedTemplate:
          errorMessage: "gateway.argocd.authenticationToken/authenticationTokenSecretName and gateway.argocd.projectAuthentication/projectAuthenticationSecretName are mutually exclusive — configure only one"

  - it: fails when authenticationTokenSecretName and projectAuthenticationSecretName are both set
    set:
      gateway.argocd.authenticationTokenSecretName: external-global-secret
      gateway.argocd.projectAuthenticationSecretName: my-external-secret
    asserts:
      - failedTemplate:
          errorMessage: "gateway.argocd.authenticationToken/authenticationTokenSecretName and gateway.argocd.projectAuthentication/projectAuthenticationSecretName are mutually exclusive — configure only one"

  - it: renders the project secret when only project tokens are set
    set:
      gateway.argocd.projectAuthentication:
        - project: alpha
          token: t1
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: stringData.PROJECT_AUTH_TOKEN_alpha
          value: t1
