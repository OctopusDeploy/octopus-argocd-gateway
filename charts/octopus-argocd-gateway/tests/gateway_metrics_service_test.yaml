suite: test gateway metrics service
templates:
  - gateway-metrics-service.yaml
set:
  gateway.argocd.authenticationToken: "my-token"
tests:
  - it: should not render when metrics disabled
    set:
      metrics.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should render a Service when metrics enabled
    set:
      metrics.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: octopus-argocd-gateway-metrics

  - it: should expose the default metrics port
    set:
      metrics.enabled: true
    asserts:
      - equal:
          path: spec.ports[0].port
          value: 9090
      - equal:
          path: spec.ports[0].name
          value: metrics

  - it: should expose a custom metrics port
    set:
      metrics.enabled: true
      metrics.port: 8888
    asserts:
      - equal:
          path: spec.ports[0].port
          value: 8888

  - it: should select the gateway pod
    set:
      metrics.enabled: true
    asserts:
      - equal:
          path: spec.selector["app.kubernetes.io/name"]
          value: octopus-argocd-gateway

  - it: should include additional service labels
    set:
      metrics.enabled: true
      metrics.service.labels:
        custom-label: my-value
    asserts:
      - equal:
          path: metadata.labels["custom-label"]
          value: my-value

  - it: should include additional service annotations
    set:
      metrics.enabled: true
      metrics.service.annotations:
        prometheus.io/scrape: "true"
    asserts:
      - equal:
          path: metadata.annotations["prometheus.io/scrape"]
          value: "true"
