suite: test gateway deployment
templates:
  - gateway-deployment.yaml
set:
  gateway.argocd.authenticationToken: "my-token"
tests:
  - it: should create a deployment
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: octopus-argocd-gateway
  - it: should set the image repository correctly
    set:
      image.repository: foobar/thing
      image.tag: "v1.0.0"
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.containers[0].image
          value: docker.io/foobar/thing:v1.0.0

  - it: should set the image registry correctly
    set:
      image.tag: "v1.0.0"
      image.registry: "foobar.io"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: foobar.io/octopusdeploy/octopus-argocd-gateway:v1.0.0

  - it: should set the image tag name correctly
    set:
      image.tag: latest
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: docker.io/octopusdeploy/octopus-argocd-gateway:latest

  - it: should set the image tag suffix correctly
    set:
      image.tagSuffix: "suffix"
      image.tag: "v1.0.0"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: docker.io/octopusdeploy/octopus-argocd-gateway:v1.0.0-suffix

  - it: should set the volume mount correctly
    asserts:
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].name
          value: configuration-volume

  - it: should set the volumes correctly
    set:
      gateway.serverCertificateSecretName: "foobar"
    asserts:
        - contains:
            path: spec.template.spec.volumes
            any: true
            content:
              name: configuration-volume
        - contains:
            path: 'spec.template.spec.volumes[?(@.name=="configuration-volume")].projected.sources'
            content:
              configMap:
                name: octopus-argocd-gateway-config
        - contains:
            path: 'spec.template.spec.volumes[?(@.name=="configuration-volume")].projected.sources'
            content:
              secret:
                name: octopus-argocd-gateway-octopus-auth-secret
        - contains:
            path: 'spec.template.spec.volumes[?(@.name=="configuration-volume")].projected.sources'
            content:
              secret:
                name: foobar
  - it: should set revision in pod template annotations
    release:
      revision: 1
    asserts:
      - equal:
          path: spec.template.metadata.annotations.revision
          value: "1"

  - it: should set env vars
    release:
      namespace: my-namespace
      name: helm-release
    chart:
      version: 1.2.3
      appVersion: 3.2.1
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: "GATEWAY_VERSION"
            value: "3.2.1"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: "HELM_CHART_VERSION"
            value: "1.2.3"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: "HELM_RELEASE_NAME"
            value: "helm-release"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: "KUBERNETES_NAMESPACE"
            value: "my-namespace"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: "OCTOPUS_ARGOCD_AUTH_TOKEN"
            valueFrom:
              secretKeyRef:
                name: "octopus-argocd-gateway-argocd-auth-secret"
                key: "token"

  - it: should correctly use argocd authentication token secret name/key, if supplied
    release:
      namespace: my-namespace
      name: helm-release
    chart:
      version: 1.2.3
      appVersion: 3.2.1
    set:
      gateway.argocd.authenticationTokenSecretName: "my-secret"
      gateway.argocd.authenticationTokenSecretKey: "MY_SECRET_KEY"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: "OCTOPUS_ARGOCD_AUTH_TOKEN"
            valueFrom:
              secretKeyRef:
                name: "my-secret"
                key: "MY_SECRET_KEY"

  - it: should template resources values into the container correctly
    set:
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources
          value:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

  - it: should omit resources when not set
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].resources

  - it: should add tmp volume and mount when readOnlyRootFilesystem is true
    set:
      securityContext.readOnlyRootFilesystem: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: tmp
            mountPath: /tmp
      - contains:
          path: spec.template.spec.volumes
          content:
            name: tmp
            emptyDir: {}

  - it: renders envFrom for chart-managed project auth tokens secret
    set:
      gateway.argocd.authenticationToken: ""
      gateway.argocd.projectAuthentication:
        - project: alpha
          token: t1
    asserts:
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: octopus-argocd-gateway-argocd-project-auth-tokens
              optional: true
            prefix: "OCTOPUS_ARGOCD_"

  - it: renders envFrom pointing at an external project auth tokens secret when supplied
    set:
      gateway.argocd.authenticationToken: ""
      gateway.argocd.projectAuthenticationSecretName: my-external-project-tokens
    asserts:
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: my-external-project-tokens
              optional: true
            prefix: "OCTOPUS_ARGOCD_"

  - it: omits envFrom entirely when no project auth tokens are configured
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].envFrom

  - it: should omit tmp volume and mount when readOnlyRootFilesystem is false
    set:
      securityContext.readOnlyRootFilesystem: false
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: tmp
            mountPath: /tmp
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: tmp
            emptyDir: {}

  - it: should template imagePullSecrets at the pod spec level
    set:
      image.imagePullSecrets:
        - name: my-registry-secret
        - name: other-secret
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets
          value:
            - name: my-registry-secret
            - name: other-secret

  - it: should template nodeSelector at the pod spec level
    set:
      nodeSelector:
        disktype: ssd
        kubernetes.io/os: linux
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector
          value:
            disktype: ssd
            kubernetes.io/os: linux

  - it: should template affinity at the pod spec level
    set:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/os
                    operator: In
                    values:
                      - linux
    asserts:
      - equal:
          path: spec.template.spec.affinity
          value:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: kubernetes.io/os
                        operator: In
                        values:
                          - linux

  - it: should template tolerations at the pod spec level
    set:
      tolerations:
        - key: dedicated
          operator: Equal
          value: gateway
          effect: NoSchedule
    asserts:
      - equal:
          path: spec.template.spec.tolerations
          value:
            - key: dedicated
              operator: Equal
              value: gateway
              effect: NoSchedule
