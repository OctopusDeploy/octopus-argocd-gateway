suite: test gateway config map
templates:
  - gateway-configmap.yaml
tests:
  - it: should work with minimum values
    set:
      gateway.argocd.serverGrpcUrl: localhost:30857
      gateway.octopus.serverGrpcUrl: localhost:8443
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: octopus-argocd-gateway-config
      - matchRegex:
          path: data["octopus-argocd-gateway.yaml"]
          pattern: 'argocd-server-url: "localhost:30857"'
      - matchRegex:
          path: data["octopus-argocd-gateway.yaml"]
          pattern: 'octopus-grpc-url: "localhost:8443"'
      - matchRegex:
          path: data["octopus-argocd-gateway.yaml"]
          pattern: 'argocd-server-insecure: false'
      - matchRegex:
          path: data["octopus-argocd-gateway.yaml"]
          pattern: 'argocd-server-plaintext: false'
      - matchRegex:
          path: data["octopus-argocd-gateway.yaml"]
          pattern: 'octopus-health-check-interval: "30s"'
      - matchRegex:
          path: data["octopus-argocd-gateway.yaml"]
          pattern: 'octopus-health-check-give-up-after: "5m"'
  - it: should work with optional values
    set:
      gateway.argocd.serverGrpcUrl: localhost:30857
      gateway.octopus.serverGrpcUrl: localhost:8443
      gateway.debug: true
      gateway.octopus.healthCheck.interval: 45s
      gateway.octopus.healthCheck.giveUpAfter: 90s
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: octopus-argocd-gateway-config
      - matchRegex:
          path: data["octopus-argocd-gateway.yaml"]
          pattern: 'argocd-server-url: "localhost:30857"'
      - matchRegex:
          path: data["octopus-argocd-gateway.yaml"]
          pattern: 'octopus-grpc-url: "localhost:8443"'
      - matchRegex:
          path: data["octopus-argocd-gateway.yaml"]
          pattern: 'debug: true'
      - matchRegex:
          path: data["octopus-argocd-gateway.yaml"]
          pattern: 'octopus-health-check-interval: "45s"'
      - matchRegex:
          path: data["octopus-argocd-gateway.yaml"]
          pattern: 'octopus-health-check-give-up-after: "90s"'
  - it: should allow setting insecure and plaintext
    set:
      gateway.argocd.serverGrpcUrl: localhost:30857
      gateway.argocd.plaintext: true
      gateway.argocd.insecure: true
      gateway.octopus.serverGrpcUrl: localhost:8443
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: octopus-argocd-gateway-config
      - matchRegex:
          path: data["octopus-argocd-gateway.yaml"]
          pattern: 'argocd-server-insecure: true'
      - matchRegex:
          path: data["octopus-argocd-gateway.yaml"]
          pattern: 'argocd-server-plaintext: true'
  - it: should allow enabling grpc-web
    set:
      gateway.argocd.serverGrpcUrl: localhost:30857
      gateway.octopus.serverGrpcUrl: localhost:8443
      gateway.argocd.grpcWeb: true
    asserts:
      - isKind:
          of: ConfigMap
      - matchRegex:
          path: data["octopus-argocd-gateway.yaml"]
          pattern: 'argocd-server-grpcweb: true'
      - matchRegex:
          path: data["octopus-argocd-gateway.yaml"]
          pattern: 'argocd-server-grpcweb-root-path: ""'
  - it: should allow setting grpc-web root path
    set:
      gateway.argocd.serverGrpcUrl: localhost:30857
      gateway.octopus.serverGrpcUrl: localhost:8443
      gateway.argocd.grpcWebRootPath: /argocd
    asserts:
      - isKind:
          of: ConfigMap
      - matchRegex:
          path: data["octopus-argocd-gateway.yaml"]
          pattern: 'argocd-server-grpcweb-root-path: "/argocd"'
  - it: should fail with missing Argo CD server url
    set:
      gateway.octopus.serverGrpcUrl: localhost:8443
    asserts:
      - failedTemplate:
          errorMessage:  You must supply gateway.argocd.serverGrpcUrl
  - it: should fail with missing Octopus gRPC server url
    set:
      gateway.argocd.serverGrpcUrl: localhost:8443
    asserts:
      - failedTemplate:
          errorMessage: You must supply gateway.octopus.serverGrpcUrl