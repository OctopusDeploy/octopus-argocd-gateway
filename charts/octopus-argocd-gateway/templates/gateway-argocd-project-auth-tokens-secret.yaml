{{- if and .Values.gateway.argocd.projectAuthentication .Values.gateway.argocd.projectAuthenticationSecretName -}}
{{- fail "gateway.argocd.projectAuthentication and gateway.argocd.projectAuthenticationSecretName cannot both be set" -}}
{{- end -}}
{{- $globalSet := or .Values.gateway.argocd.authenticationToken .Values.gateway.argocd.authenticationTokenSecretName -}}
{{- $projectSet := or .Values.gateway.argocd.projectAuthentication .Values.gateway.argocd.projectAuthenticationSecretName -}}
{{- if and $globalSet $projectSet -}}
{{- fail "gateway.argocd.authenticationToken/authenticationTokenSecretName and gateway.argocd.projectAuthentication/projectAuthenticationSecretName are mutually exclusive — configure only one" -}}
{{- end -}}
{{- if .Values.gateway.argocd.projectAuthentication }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "octopus-argocd-gateway.argocd.projectAuthTokens.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "octopus-argocd-gateway.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range .Values.gateway.argocd.projectAuthentication }}
  PROJECT_AUTH_TOKEN_{{ .project }}: {{ .token | quote }}
  {{- end }}
{{- end }}
