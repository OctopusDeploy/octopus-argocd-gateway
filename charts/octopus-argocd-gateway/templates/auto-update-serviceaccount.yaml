{{ if and .Values.autoUpdate.enabled .Values.autoUpdate.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "octopus-argocd-gateway.autoUpdate.serviceAccountName" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "octopus-argocd-gateway.labels" . | nindent 4 }}
  annotations:
    {{- with .Values.autoUpdate.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
automountServiceAccountToken: {{ .Values.autoUpdate.serviceAccount.automountServiceAccountToken }}
{{- end }}