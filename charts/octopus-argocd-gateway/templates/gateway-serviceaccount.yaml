{{- if .Values.gateway.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "octopus-argocd-gateway.gateway.serviceAccountName" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "octopus-argocd-gateway.labels" . | nindent 4 }}
  annotations:
    {{- with .Values.gateway.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
automountServiceAccountToken: {{ .Values.gateway.serviceAccount.automountServiceAccountToken }}
{{- end }}