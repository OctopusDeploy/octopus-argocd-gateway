{{- if and .Values.registration.register .Values.registration.octopus.serverAccessToken }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "octopus-argocd-gateway.registration.secretName"  . }}
  labels:
  {{- include "octopus-argocd-gateway.labels" . | nindent 4 }}
  annotations:
  {{- include "octopus-argocd-gateway.registration.hookAnnotationsWithSuccessDelete" . | nindent 4 }}
    "helm.sh/hook-weight": "-5"
type: Opaque
stringData:
  {{ include "octopus-argocd-gateway.registration.secretKey" . }}: {{ .Values.registration.octopus.serverAccessToken | quote }}
{{- end }}