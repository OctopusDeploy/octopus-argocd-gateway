{{- if not .Values.gateway.serverCertificateSecretName}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "octopus-argocd-gateway.certificates.secretName"  . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "octopus-argocd-gateway.labels" . | nindent 4 }}
data:
  {{- if .Values.gateway.octopus.serverCertificate}}
  octopus-server-grpc-certificate.pem: {{ .Values.gateway.octopus.serverCertificate | quote }}
  {{- end}}
  {{- if .Values.registration.octopus.serverCertificate}}
  octopus-server-http-certificate.pem: {{ .Values.registration.octopus.serverCertificate | quote }}
  {{- end}}
  {{- if .Values.gateway.argocd.serverCertificate}}
  argo-cd-server-certificate.pem: {{ .Values.gateway.argocd.serverCertificate | quote }}
  {{- end}}
  {{- range $index, $cert := .Values.gateway.serverCertificates}}
  certificate-{{$index}}.pem: {{$cert}}
  {{- end}}
{{- end}}
