{{- if and .Values.registration.register .Values.registration.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "octopus-argocd-gateway.registration.serviceAccountName" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "octopus-argocd-gateway.labels" . | nindent 4 }}
  annotations:
    {{- include "octopus-argocd-gateway.registration.hookAnnotationsWithSuccessDelete" . | nindent 4 }}
    "helm.sh/hook-weight": "-5"
    {{- with .Values.registration.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
automountServiceAccountToken: {{ .Values.registration.serviceAccount.automountServiceAccountToken }}
{{- end }}