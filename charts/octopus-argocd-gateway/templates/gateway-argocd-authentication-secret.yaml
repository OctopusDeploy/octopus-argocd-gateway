{{- if .Values.gateway.argocd.authenticationToken }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "octopus-argocd-gateway.argocd.authToken.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "octopus-argocd-gateway.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ include "octopus-argocd-gateway.argocd.authToken.secretKey" . }}: {{ .Values.gateway.argocd.authenticationToken | quote }}
{{- end }}
