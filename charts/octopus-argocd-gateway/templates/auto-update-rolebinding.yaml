{{ if and .Values.autoUpdate.enabled .Values.autoUpdate.serviceAccount.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name:  {{ include "octopus-argocd-gateway.autoUpdate.roleBindingName" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "octopus-argocd-gateway.labels" . | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: {{ include "octopus-argocd-gateway.autoUpdate.serviceAccountName" . }}
  namespace: {{ .Release.Namespace | quote }}
roleRef:
  kind: Role
  name: {{ include "octopus-argocd-gateway.autoUpdate.roleName" . }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}